name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker compose build
      - name: Verify
        run: docker compose run --rm web pnpm run verify

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start app
        run: docker compose up -d
      - name: Wait for app
        run: timeout 30 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 1; done'
      - name: Run E2E tests
        run: |
          docker run --rm --network host -e CI=true \
            -v "${{ github.workspace }}:/work" -w /work \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm run test:e2e"
      - name: Stop app
        if: always()
        run: docker compose down
